name: cyberlounge

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  bot:
    build:
      context: ./tg_bot
      dockerfile: Dockerfile
    command: sh -c "sleep 8 && node index.js"
    volumes:
      - ./tg_bot:/app
      - /app/node_modules
    environment:
      - BOT_TOKEN=${BOT_TOKEN:-8409485327:AAGpGRUFxb9z829Gwt11geK0khdFV12uxfw}
      - API_BASE_URL=http://backend:8000/api
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./tg_mini_app
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./tg_mini_app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
